syntax = "proto3";
package Protocol;

message C_REGISTER
{
	string name = 1;
	string email = 2;
	string password = 3;
}

message S_REGISTER
{
	bool success = 1;
	string msg = 2;
}

message C_LOGIN
{
	string email = 1;
	string password = 2;
}

message S_LOGIN
{
	bool success = 1;
	string msg = 2;
	string name = 3;
}

message Room
{
	int32 roomId = 1;
	string roomName = 2;
}

message C_CREATE_ROOM
{
	string roomName = 1;
}

message S_CREATE_ROOM
{
	bool success = 1;
	uint32 roomId = 2;
}

message C_GET_ROOM_LIST
{
	
}

message S_GET_ROOM_LIST
{
	bool success = 1;
	repeated Room rooms = 2;
}

message C_ENTER_ROOM
{
	uint32 roomId = 1;
}

message S_ENTER_ROOM
{
	bool success = 1;
	uint32 roomId = 2;
}

message C_EXIT_ROOM
{
	uint32 roomId = 1;
}

message S_EXIT_ROOM
{
	int32 success = 1;
}

message C_UPDATE_NICKNAME
{
	string newNickname = 1;
}

message S_UPDATE_NICKNAME
{
	bool success = 1;
	string msg = 2;
}

message C_DELETE_ACCOUNT
{
}

message S_DELETE_ACCOUNT
{
	bool success = 1;
	string msg = 2;
}

// ==========================
// 채팅 관련
// ==========================

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	string msg = 1;
	string name = 2;
}

message C_SHOUT
{
	string msg = 1;
}

message S_SHOUT
{
	string msg = 1;
	string name = 2;
}

message C_WHISPER
{
	string target_nickname = 1;
	string message = 2;
}

message S_WHISPER
{
	string from_name = 1;
	string to_name = 2;
	string message = 3;
	bool success = 4;
	string error_msg = 5;
}

// ==========================
// 친구 추가 관련
// ==========================

message FriendInfo
{
	string email = 1;
	string nickname = 2;
	bool is_online = 3;
}

message C_REQUEST_FRIEND
{
	string email = 1;
}

message S_REQUEST_FRIEND
{
	bool success = 1;
	string msg = 2;
}

message C_ACCEPT_FRIEND
{
	string email = 1;
}

message S_ACCEPT_FRIEND
{
	bool success = 1;
	string msg = 2;
}

message C_REJECT_FRIEND
{
	string email = 1;
}

message S_REJECT_FRIEND
{
	bool success = 1;
	string msg = 2;
}

message C_GET_PENDING_FRIENDS
{
}

message S_GET_PENDING_FRIENDS
{
	bool success = 1;
	repeated FriendInfo pendings = 2;
}

message C_GET_FRIEND_LIST
{
}

message S_GET_FRIEND_LIST
{
	bool success = 1;
	repeated FriendInfo friends = 2;
}

message C_REMOVE_FRIEND
{
	string email = 1;
}

message S_REMOVE_FRIEND
{
	bool success = 1;
	string msg = 2;
}

// ==========================
// 포인트 (잔고 조회 / 이체)
// ==========================

message C_GET_BALANCE
{
}

message S_GET_BALANCE
{
	bool success = 1;
	int64 balance = 2;
}

message C_TRANSFER
{
	string target_nickname = 1;
	int64 amount = 2;
}

message S_TRANSFER
{
	bool success = 1;
	string msg = 2;
	int64 my_balance = 3;
	int32 retries = 4;      // OCC 충돌로 재시도한 횟수 (0 이면 첫 시도에 성공)
}

// 수신자가 온라인이면 서버가 push 로 알려준다.
message S_TRANSFER_RECEIVED
{
	string from_name = 1;
	int64 amount = 2;
	int64 my_balance = 3;
}

// ==========================
// AI 채팅 (Claude API 스트리밍)
// ==========================

message C_AI_CHAT
{
	string message = 1;
}

// 서버가 API 의 SSE 조각을 받는 대로 text 를 실어 보낸다. done = true 인 마지막 패킷에 success / error_msg.
message S_AI_CHAT
{
	string text = 1;
	bool done = 2;
	bool success = 3;
	string error_msg = 4;
}